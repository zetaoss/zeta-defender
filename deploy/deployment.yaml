apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeta-defender
  labels:
    app.kubernetes.io/name: zeta-defender
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zeta-defender
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeta-defender
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: zeta-defender
          image: ghcr.io/zetaoss/zeta-defender:latest
          args:
            - -config
            - /etc/zeta-defender/config.yaml
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: zeta-defender
                  key: cloudflare-api-token
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/zeta-defender
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: zeta-defender
